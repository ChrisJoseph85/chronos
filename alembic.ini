[alembic]
script_location = alembic
prepend_sys_path = .
# Target database file for migrations (deploy spec: never an in-memory DB).
# Overridden at runtime by CHRONOS_DB (see alembic/env.py).
sqlalchemy.url = sqlite:///./chronos.db
db_path = ./chronos.db

[loggers]
keys = root

[handlers]
keys = console

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
