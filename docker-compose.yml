services:
  chronos:
    build: .
    image: chronos:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - chronos-data:/data
    env_file:
      - path: .env
        required: false
    command: ["serve", "--host", "0.0.0.0", "--port", "8080", "--db", "/data/chronos.db"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  chronos-data:
