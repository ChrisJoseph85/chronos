name: app-electron
on:
  push:
    paths: ["app-electron/**", ".github/workflows/app-electron.yml"]
  pull_request:
    paths: ["app-electron/**", ".github/workflows/app-electron.yml"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:renderer
      - run: npx electron-builder --linux dir --publish never
